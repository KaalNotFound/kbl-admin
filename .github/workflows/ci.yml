name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit gate (fails on high/critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Unit and route tests (Vitest)
        run: npx vitest run

      - name: Contract, acceptance, and performance-bench suites
        run: npm run test:contract

      - name: Production build
        run: npm run build
